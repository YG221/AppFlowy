name: personal-local-windows-portable

# Builds a Windows x64 portable zip for this fork. It does not publish a
# GitHub Release. Run it with workflow_dispatch on a Windows runner.
# This file has not been executed in the environment that added it.
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.27.4"
  RUST_TOOLCHAIN: "1.85.0"
  APP_VERSION: personal-local

jobs:
  build-for-windows:
    name: windows-x64 portable zip
    runs-on: windows-2019
    env:
      WINDOWS_APP_RELEASE_PATH: frontend\appflowy_flutter\product\personal-local\windows
      WINDOWS_ZIP_NAME: AppFlowy-personal-local-windows-x86_64.zip
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: x86_64-pc-windows-msvc
          override: true
          profile: minimal

      - name: Install prerequisites
        working-directory: frontend
        run: |
          vcpkg integrate install
          cargo install --force --locked cargo-make
          cargo install --force --locked duckscript_cli

      - name: Build Windows app
        working-directory: frontend
        run: |
          flutter config --enable-windows-desktop
          dart ./scripts/flutter_release_build/build_flowy.dart exclude-directives . ${{ env.APP_VERSION }}
          cargo make --env APP_VERSION=${{ env.APP_VERSION }} --profile production-windows-x86 appflowy
          dart ./scripts/flutter_release_build/build_flowy.dart include-directives . ${{ env.APP_VERSION }}

      - name: Archive portable folder
        uses: vimtor/action-zip@v1
        with:
          files: ${{ env.WINDOWS_APP_RELEASE_PATH }}\
          dest: ${{ env.WINDOWS_APP_RELEASE_PATH }}\${{ env.WINDOWS_ZIP_NAME }}

      - name: SHA256
        working-directory: ${{ env.WINDOWS_APP_RELEASE_PATH }}
        run: certutil -hashfile ${{ env.WINDOWS_ZIP_NAME }} SHA256 > AppFlowy-personal-local-windows-x86_64.sha256.txt

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: AppFlowy-personal-local-windows-x86_64
          path: |
            ${{ env.WINDOWS_APP_RELEASE_PATH }}\${{ env.WINDOWS_ZIP_NAME }}
            ${{ env.WINDOWS_APP_RELEASE_PATH }}\AppFlowy-personal-local-windows-x86_64.sha256.txt
          if-no-files-found: error
